<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM"
            crossorigin="anonymous">
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
            crossorigin="anonymous"></script>
    </head>
    <body>

        <h1 class="m-4">アカウント登録</h1>
        <form action="/create-user" method="post" class="m-4">
            <div class="mb-3">
                <label for="nickname"
                    class="form-label">ニックネーム</label>
                <input name="nickname" type= "text" class="form-control"
                    id="nickname" placeholder="tarou__tanaka" required>
            </div>
            <div class="mb-3">
                <label for="name"
                    class="form-label">名前（本名）</label>
                <input name="name" type="text" class="form-control"
                    id="name" placeholder="（例）田中太郎">
            </div>
            <div class="mb-3">
                <label for="password"
                    class="form-label">パスワード</label>
                <input name="password" type="password" class="form-control"
                    id="password" placeholder="（例）tanaka0101">
            </div>
            <div class="mb-3">
                <label for="email"
                    class="form-label">メールアドレス（任意）</label>
                <input name="email" type="email" class="form-control"
                    id="email"
                    placeholder="（例）takakatarou@NCAPP.com">
            </div>
            <div class="mb-3">
                <select class="form-select" aria-label="Default select example">
                    <option selected>出身地を選んでください</option>
                    <option value="1">北海道</option>
                    <option value="2">青森</option>
                    <option value="3">岩手</option>
                    <option value="4">宮城県</option>
                    <option value="5">秋田県</option>
                    <option value="6">山形県</option>
                    <option value="7">福島県</option>
                    <option value="8">茨城県</option>
                    <option value="9">栃木県</option>
                    <option value="10">群馬県</option>
                    <option value="11">埼玉県</option>
                    <option value="12">千葉県</option>
                    <option value="13">東京都</option>
                    <option value="14">神奈川県</option>
                    <option value="15">新潟県</option>
                    <option value="16">富山県</option>
                    <option value="17">石川県</option>
                    <option value="18">福井県</option>
                    <option value="19">山梨県</option>
                    <option value="20">長野県</option>
                    <option value="21">岐阜県</option>
                    <option value="22">静岡県</option>
                    <option value="23">愛知県</option>
                    <option value="24">三重県</option>
                    <option value="25">滋賀県</option>
                    <option value="26">京都府</option>
                    <option value="27">大阪府</option>
                    <option value="28">兵庫県</option>
                    <option value="29">奈良県</option>
                    <option value="30">和歌山県</option>
                    <option value="31">鳥取県</option>
                    <option value="32">島根県</option>
                    <option value="33">岡山県</option>
                    <option value="34">広島県</option>
                    <option value="35">山口県</option>
                    <option value="36">徳島県</option>
                    <option value="37">香川県</option>
                    <option value="38">愛媛県</option>
                    <option value="39">高知県</option>
                    <option value="40">福岡県</option>
                    <option value="41">佐賀県</option>
                    <option value="42">長崎県</option>
                    <option value="43">熊本県</option>
                    <option value="44">大分県</option>
                    <option value="45">宮崎県</option>
                    <option value="46">鹿児島県</option>
                    <option value="47">沖縄県</option>
                </select>
            </div>
            <div class="mb-1">
                <label for="exampleFormControlInput1"
                    class="form-label">好きな分類</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value
                    id="flexCheckDefault">
                <label class="form-check-label" for="flexCheckDefault">
                    社会
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value
                    id="flexCheckChecked">
                <label class="form-check-label" for="flexCheckChecked">
                    気象
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value
                    id="flexCheckChecked">
                <label class="form-check-label" for="flexCheckChecked">
                    災害
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value
                    id="flexCheckDefault">
                <label class="form-check-label" for="flexCheckDefault">
                    科学
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value
                    id="flexCheckDefault">
                <label class="form-check-label" for="flexCheckDefault">
                    文化
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value
                    id="flexCheckDefault">
                <label class="form-check-label" for="flexCheckDefault">
                    政治
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value
                    id="flexCheckDefault">
                <label class="form-check-label" for="flexCheckDefault">
                    ビジネス
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value
                    id="flexCheckDefault">
                <label class="form-check-label" for="flexCheckDefault">
                    国際
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value
                    id="flexCheckDefault">
                <label class="form-check-label" for="flexCheckDefault">
                    スポーツ
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value
                    id="flexCheckDefault">
                <label class="form-check-label" for="flexCheckDefault">
                    暮らし
                </label>
            </div>
            <button type="submit" class="btn btn-info">アカウント作成</button>
        </form>

    </body>
</html>
